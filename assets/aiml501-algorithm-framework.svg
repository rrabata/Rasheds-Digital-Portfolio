<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 735"><title id="title">AIML-501 algorithm framework</title><desc id="desc">Four application domains and the relevant machine learning algorithm families, emphasizing supervised, unsupervised and generative learning.</desc><rect width="1200" height="735" fill="#081321"/><text x="66" y="80" fill="#5ce0c0" font-family="Arial" font-size="23" font-weight="bold">AIML-501  /  ARTIFACT 6</text><text x="66" y="137" fill="white" font-family="Arial" font-size="43" font-weight="bold">Machine Learning Algorithm Map</text><text x="66" y="176" fill="#afc3d2" font-family="Arial" font-size="21">12 algorithms • 4 application domains • learning styles overlap</text><rect x="65" y="222" width="518" height="172" rx="19" fill="#11263a" stroke="#f9c56a" stroke-width="3"/><text x="90" y="260" fill="#f9c56a" font-family="Arial" font-size="22" font-weight="bold">TABULAR DATA</text><text x="90" y="306" fill="#edf7fc" font-family="Arial" font-size="19">Decision Tree · Random Forest · Gradient Boosting</text><text x="90" y="344" fill="#afc3d2" font-family="Arial" font-size="18">SVM · K-means · PCA</text><rect x="615" y="222" width="518" height="172" rx="19" fill="#11263a" stroke="#80b5ff" stroke-width="3"/><text x="640" y="260" fill="#80b5ff" font-family="Arial" font-size="22" font-weight="bold">COMPUTER VISION</text><text x="640" y="306" fill="#edf7fc" font-family="Arial" font-size="19">CNN · K-means · PCA</text><text x="640" y="344" fill="#afc3d2" font-family="Arial" font-size="18">GAN · Diffusion</text><rect x="65" y="419" width="518" height="172" rx="19" fill="#11263a" stroke="#5ce0c0" stroke-width="3"/><text x="90" y="457" fill="#5ce0c0" font-family="Arial" font-size="22" font-weight="bold">NATURAL LANGUAGE</text><text x="90" y="503" fill="#edf7fc" font-family="Arial" font-size="19">BERT · GPT</text><text x="90" y="541" fill="#afc3d2" font-family="Arial" font-size="18">Understand vs. generate</text><rect x="615" y="419" width="518" height="172" rx="19" fill="#11263a" stroke="#ec9cce" stroke-width="3"/><text x="640" y="457" fill="#ec9cce" font-family="Arial" font-size="22" font-weight="bold">GENERATIVE AI</text><text x="640" y="503" fill="#edf7fc" font-family="Arial" font-size="19">GPT · GAN · Diffusion · VAE</text><text x="640" y="541" fill="#afc3d2" font-family="Arial" font-size="18">Text · Images · Synthetic examples</text><rect x="65" y="636" width="1068" height="60" rx="12" fill="#1c2b37"/><text x="86" y="673" fill="#edf7fc" font-family="Arial" font-size="17">Learning styles: supervised (labeled) • unsupervised (patterns) • self-supervised / generative (model objectives)</text></svg>